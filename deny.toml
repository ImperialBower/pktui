    # Configuration for cargo-deny
# https://embarkstudios.github.io/cargo-deny/

# Note: running just `cargo deny check` is equivalent to `cargo deny check advisories bans licenses sources`

[advisories]
# The path where the advisory database is cloned/fetched into
db-path = "~/.cargo/advisory-db"
# The url(s) of the advisory databases to use
db-urls = ["https://github.com/rustsec/advisory-db"]
# The lint level for crates that have been yanked from their source registry
yanked = "deny"
# A list of advisory IDs to ignore. Note that ignored advisories will still
# output a note when they are encountered.
#
# Empty as of pkcore 0.2.1: that release disables postcard's default
# `heapless-cas` feature, so `heapless 0.7 → atomic-polyfill` (RUSTSEC-2023-0089,
# unmaintained) is no longer in the dependency tree and needs no suppression.
ignore = []

[licenses]
# List of explicitly allowed licenses
# See https://spdx.org/licenses/ for list of possible licenses
#
# pktui and pkcore are both MIT OR Apache-2.0. The allowlist permits other
# permissive licenses commonly used in the Rust ecosystem, plus MPL-2.0 for
# two specific transitive dependencies (see below).
#
# Strong copyleft licenses (GPL, AGPL, LGPL) are intentionally NOT listed —
# adding one would force a license change on pktui's distributed binary.
#
# NOTE: To avoid warnings, only actively used licenses are listed below.

allow = [
    # Most common in Rust (covers ~90% of crates)
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",

    # BSD family
    "BSD-2-Clause",
    "BSD-3-Clause",
    "0BSD",

    # Public domain / highly permissive
    "Unlicense",
    "Zlib",

    # Other common
    "Unicode-3.0",

    # MPL-2.0 is a weak file-level copyleft: modifications to MPL files
    # must be open-sourced, but linking from a non-MPL binary is allowed.
    # Pulled in by `colored` (transitively via cardpack → pkcore) and
    # `option-ext` (transitively via dirs).
    "MPL-2.0",
]

# The confidence threshold for detecting a license from license text.
confidence-threshold = 0.8

# Allow 1 or more licenses on a per-crate basis
exceptions = []

# Ignore workspace members for license checks (they're your own code)
private = { ignore = true }

[bans]
# Lint level for when multiple versions of the same crate are detected
multiple-versions = "warn"
# Lint level for when a crate version requirement is `*`
wildcards = "warn"
# Allow wildcard versions for path/git dependencies. `pkdealer_proto` is a
# deliberate cross-repo git dependency (no published version to pin), so its
# wildcard is expected; registry deps are still held to the `wildcards` rule.
allow-wildcard-paths = true
# The graph highlighting used when creating dotgraphs for crates
# with multiple versions
highlight = "all"
# List of crates that are allowed. Use with care!
allow = []
# List of crates to deny
deny = []
# Certain crates/versions that will be skipped when doing duplicate detection.
skip = []
# Subtrees we do NOT traverse for duplicate detection. Any version skew
# inside one of these trees is upstream's problem to resolve — we still
# catch duplicates introduced by our own direct dependencies, just not
# ones that originate inside these libraries.
#
# Why each is here:
# * pkcore — depends on rusqlite 0.34 (hashbrown 0.15 / foldhash 0.1),
#   random_name_generator 0.3 (rand 0.8 / rand_core 0.6 / rand_chacha 0.3),
#   strum 0.28, and uses both getrandom 0.2 and 0.3 directly for WASM
#   compatibility. None of those are things pktui can change.
# * ratatui — kasuari pulls hashbrown 0.16 and strum 0.27, both of which
#   conflict with the pkcore-side versions.
# * tonic — tonic 0.12 pulls tower 0.4 and socket2 0.5, while its own axum /
#   hyper-util / tokio bring tower 0.5 and socket2 0.6. The skew lives entirely
#   inside the tonic stack; resolving it means upgrading to tonic 0.13, which
#   pktui shares with pkdealer_proto and is out of scope here.
skip-tree = [
    { name = "pkcore" },
    { name = "ratatui" },
    { name = "tonic" },
]

[sources]
# Lint level for what to happen when a crate from a crate registry that is not
# in the allow list is encountered
unknown-registry = "warn"
# Lint level for what to happen when a crate from a git repository that is not
# in the allow list is encountered
unknown-git = "warn"
# List of URLs for allowed crate registries. Defaults to the crates.io index
# if not specified. If it is specified but empty, no registries from URLs
# will be allowed.
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# List of URLs for allowed Git repositories. pkdealer hosts the `pkdealer_proto`
# crate that pktui pulls as a git dependency (see Cargo.toml).
allow-git = ["https://github.com/ImperialBower/pkdealer"]

